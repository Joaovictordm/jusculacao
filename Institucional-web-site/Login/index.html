<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
      <link rel="stylesheet" href="./style/styleConfig.css">
      <link rel="stylesheet" href="./style/styleLogin.css">
      <link rel="stylesheet" href="../landing-page/index.html">
</head>
<body>
    <div class="container">
        <div class="containerForm">
            <div class="ContainerSeta">
                <img class="img" src="../IMGs/arrow-back.svg" onclick="window.location.href = '../landing-page/index.html'" >
            </div>
            <div class="containerLogo">
                <img src="../IMGs/logo.jpg">
                <span>Calount</span>
            </div>

            <div class="containerLogin">
                <div class="containerCard">
                    <div class="title">
                        <span>Email</span>
                    </div>

                    <div>
                        <input type="text" class="input" placeholder="Digite seu email">
                    </div>
                </div>

                <div class="containerCard">
                    <div class="title">
                        <span>Senha</span>
                    </div>

                    <div >
                        <input type="text" class="input" placeholder="Digite sua senha">
                    </div>
                </div>
            </div>

            <div class="containerButton">
                <div class="register">
                    <span>
                        Não tem conta? <a onclick="window.location.href = '../register/index.html'">Cadastre-se</a>
                    </span>
                </div>
                
              
                    <button class="button" onclick="window.location.href = '../dashboard/index/index.html'">Logar</button>
            
                
                <div class="password">
                    <span onclick="window.location.href = '../recuperar-senha/enviar-email/index.html'">Esqueceu a senha?</span>
                </div>
            </div>
        </div>

        <div class="containerImg">
            <img src="../IMGs/gym.svg" class="img">
        </div>
    </div>
</body>
</html>
