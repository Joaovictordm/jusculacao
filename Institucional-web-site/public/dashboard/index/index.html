<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./style/styleConfig.css">
    <link rel="stylesheet" href="./style/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>
    <div class="containerScreen">
        <aside class="containerSide">
            <span class="titleName">Olá <span id="nome_span"></span></span>
            <div class="screen1">
                <img src="../../IMGs/stats-chart-outline.svg">
                <span>Dashboard</span>
            </div>

            <div class="screen" onclick="window.location.href = '../add-food/index.html'">
                <img src="../../IMGs/add-sharp.svg">
                <span>Nova comida</span>
            </div>

            <div class="exit" onclick="window.location.href = '../../index.html'">
                <img src="../../IMGs/arrow-back.svg">
                <span>Sair</span>
            </div>
        </aside>

        <div class="containerDashboard">
            <div class="containerBodyDashboard">
                <div class="containerKpis">
                    <div class="kpi">
                        <div class="containerImg"><img src="../../IMGs/alvo.png"></div>
                        <span class="title">Meta</span>
                        <span class="desc" id="descricao_value"></span>
                    </div>

                    <div class="kpi">
                        <div class="containerImg"><img src="../../IMGs/fast-food-black.svg"></div>
                        <span class="title">Faltam</span>
                        <span class="desc">250 calorias</span>
                    </div>
                </div>

                <div class="containerChart">
                    <canvas id="grafico" class="graficoStyle"></canvas>
                </div>

                <div class="containerAdicionar">
                    <select class="select">
                        <option>Arroz</option>
                        <option>Carne bovina</option>
                        <option>Batata</option>
                        <option>Arroz</option>
                        <option>Carne bovina</option>
                        <option>Batata</option>
                        <option>Arroz</option>
                        <option>Carne bovina</option>
                        <option>Batata</option>
                        <option>Arroz</option>
                        <option>Carne bovina</option>
                        <option>Batata</option>
                        <option>Arroz</option>
                        <option>Carne bovina</option>
                        <option>Batata</option>
                        <option>Arroz</option>
                        <option>Carne bovina</option>
                        <option>Batata</option>
                        <option>Arroz</option>
                        <option>Carne bovina</option>
                        <option>Batata</option>
                    </select>

                    <span class="spanTitle">Peso em gramas</span>
                    <input class="input" placeholder="g">
                    <button class="button">Contabilizar</button>
                </div>
            </div>


        </div>
    </div>
</body>

</html>

<script>
    nome_span.innerHTML = sessionStorage.NOME_USUARIO;

    fetch(`/taxa/pegarTaxa/${sessionStorage.ID_USUARIO}`, {
        method: "GET",
        headers: {
            "Content-Type": "application/json",
        }
    })
        .then((resposta) => {
            resposta.json().then((dados) => {
               console.log(dados)
               descricao_value.innerHTML = `${dados} Calorias`;
            })
        })
        .catch((erro) => {
            console.log(erro);
        });

    var sensorAnalogico = new Chart(document.getElementById('grafico').getContext('2d'), {
        type: 'bar',
        data: {
            datasets: [{
                label: 'Calorias',
                borderWidth: 3,
                fill: true
            }]
        },
        options: {
            scales: {
                x: {
                    beginAtZero: true
                },
                y: {
                    min: 0,
                    max: 40,
                    title: {
                        display: true,
                        text: '(C°)'
                    },
                    beginAtZero: true,
                },
            },
        }
    });

</script>
</body>

</html>
