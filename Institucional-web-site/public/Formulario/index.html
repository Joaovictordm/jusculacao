<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
     <link rel="stylesheet" href="./style/styleConfig.css">
     <link rel="stylesheet" href="./style/styleForm.css">
</head>
<body>
    <div class="containerForm">
         <div class="containerTitle">
            <span>Olá ${nome}</span>
         </div>

         <div class="containerDesc">
            <span>Vamos fazer o calculo da sua taxa metabolica basal com base na equação de Mifflin-St Jeor</span>
         </div>

         <div class="containerInput">
            <div class="containerTitle">
                <span>Peso (kg)</span>
            </div>
            <input placeholder="Digite aqui">

             <div class="containerTitle">
                <span>Altura (cm)</span>
            </div>
            <input placeholder="Digite aqui">

             <div class="containerTitle">
                <span>Idade</span>
            </div>
            <input placeholder="Digite aqui">
         </div>

         <div class="containerNivel">
            <span>Sexo</span>

            <Select class="containerSelect">
                <option value="sedentario">Masculino</option>
                <option value="Levemente ativo">Feminino</option>
            </Select>
         </div>

         <div class="containerNivel">
            <span>Qual o seu nivel de atividade física?</span>

            <Select class="containerSelect">
                <option value="sedentario">Sedentário</option>
                <option value="Levemente ativo">Levemente ativo</option>
                <option value="Moderado">Moderado</option>
                <option value="Muito ativo">Muito ativo</option>
            </Select>
         </div>
         
         <div class="containerNivel">
            <span>Qual seu objetivo?</span>

            <Select class="containerSelect">
                <option value="emagrecer">Emagrecer</option>
                <option value="manter peso">Manter o peso</option>
                <option value="Ganhar massa">Ganhar massa</option>
            </Select>

        </div>
        <button>
            Calcular
        </button>
    </div>
</body>
</html>
