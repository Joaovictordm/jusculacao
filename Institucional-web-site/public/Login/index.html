<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
      <link rel="stylesheet" href="./style/styleConfig.css">
      <link rel="stylesheet" href="./style/styleLogin.css">
      <link rel="stylesheet" href="../landing-page/index.html">
</head>
<body>
    <div class="container">
        <div class="containerForm">
            <div class="ContainerSeta">
                <img class="img" src="../IMGs/arrow-back.svg" onclick="window.location.href = '../index.html'" >
            </div>
            <div class="containerLogo">
                <img src="../IMGs/logo.jpg">
                <span>Calount</span>
            </div>

            <div class="containerLogin">
                <div class="containerCard">
                    <div class="title">
                        <span>Email</span>
                    </div>

                    <div>
                        <input type="text" class="input" placeholder="Digite seu email" id="email_input">
                    </div>
                    <div id="erro_email"></div>
                </div>

                <div class="containerCard">
                    <div class="title">
                        <span>Senha</span>
                    </div>

                    <div >
                        <input type="text" class="input" placeholder="Digite sua senha" id="senha_input">
                    </div>
                    <div id="erro_senha"></div>
                </div>
                <div id="mensagem_erro"></div>
            </div>

            <div class="containerButton">
                <div class="register">
                    <span>
                        Não tem conta? <a onclick="window.location.href = '../register/index.html'">Cadastre-se</a>
                    </span>
                </div>
                
              
                    <button class="button" onclick="entrar()">Logar</button>
            
                
                <div class="password">
                    <span onclick="window.location.href = '../recuperar-senha/enviar-email/index.html'">Esqueceu a senha?</span>
                </div>
            </div>
        </div>

        <div class="containerImg">
            <img src="../IMGs/gym.svg" class="img">
        </div>
    </div>
</body>
</html>

<script>


    function entrar() {
        var emailVar = email_input.value;
        var senhaVar = senha_input.value;

        if (emailVar == "" || senhaVar == "") {
            // cardErro.style.display = "block"
            mensagem_erro.innerHTML = "Os campos não podem estar em branco";
            return false;
        }
        else {
            setInterval(sumirMensagem, 5000)
        }

        console.log("FORM LOGIN: ", emailVar);
        console.log("FORM SENHA: ", senhaVar);

        fetch("/usuarios/autenticar", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                emailServer: emailVar,
                senhaServer: senhaVar
            })
        }).then(function (resposta) {
            console.log("ESTOU NO THEN DO entrar()!")

            if (resposta.ok) {
                console.log(resposta);

                resposta.json().then(json => {
                    console.log(json);
                    console.log(JSON.stringify(json));
                    sessionStorage.EMAIL_USUARIO = json.email;
                    sessionStorage.NOME_USUARIO = json.nome;
                    sessionStorage.ID_USUARIO = json.id;

                    setTimeout(function () {
                        window.location = "../dashboard/index/index.html";
                    }, 1000); // apenas para exibir o loading

                });

            } else {

                console.log("Houve um erro ao tentar realizar o login!");

                resposta.text().then(texto => {
                    console.error(texto);
                });
            }

        }).catch(function (erro) {
            console.log(erro);
        })

        return false;
    }

    function sumirMensagem() {
        cardErro.style.display = "none"
    }

</script>
